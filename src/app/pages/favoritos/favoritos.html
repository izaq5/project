<div class="container page favoritos-page">
  <div class="page-header">
    <h1>⭐ Meus Favoritos</h1>
    <p>{{ favoriteProducts().length }} produto(s) salvos</p>
  </div>

  @if (favoriteProducts().length) {
    <div class="grid-products">
      @for (p of favoriteProducts(); track p.id) {
        <app-product-card [product]="p" />
      }
    </div>
  } @else {
    <div class="empty-state">
      <div class="empty-icon">⭐</div>
      <h3>Você ainda não tem favoritos</h3>
      <p>Toque na estrela dos produtos para salvá-los aqui.</p>
      <a routerLink="/produtos" class="btn btn-primary">Ver Produtos</a>
    </div>
  }
</div>
